<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hub · Lucas Olavarria</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    background:#0e1119;
    min-height:100dvh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    font-family:'Helvetica Neue',Arial,sans-serif;
    padding:24px 16px;
    gap:12px;
  }
  .logo{
    display:flex;align-items:center;gap:10px;
    margin-bottom:8px;
  }
  .logo svg{flex-shrink:0;}
  .logo-text{
    font-family:'Georgia',serif;
    font-size:15px;font-weight:400;
    color:#eceef3;letter-spacing:.02em;
    line-height:1.3;
  }
  .logo-sub{
    font-size:10px;
    color:#5b9cf6;
    letter-spacing:.08em;
    text-transform:uppercase;
    font-family:'Courier New',monospace;
    font-style:normal;
  }
  .cards{
    width:100%;max-width:420px;
    display:flex;flex-direction:column;gap:10px;
  }
  .card{
    display:flex;align-items:center;gap:18px;
    background:#151b27;
    border:1px solid #1e2535;
    border-radius:16px;
    padding:22px 22px;
    cursor:pointer;
    text-decoration:none;
    transition:background .15s,border-color .15s,transform .1s;
    -webkit-tap-highlight-color:transparent;
  }
  .card:active{transform:scale(.985);}
  .card:hover{background:#1a2236;border-color:#2a3550;}
  .icon{
    width:48px;height:48px;border-radius:12px;
    display:flex;align-items:center;justify-content:center;
    flex-shrink:0;font-size:22px;
  }
  .c1 .icon{background:rgba(91,156,246,.15);}
  .c2 .icon{background:rgba(45,212,160,.12);}
  .c3 .icon{background:rgba(155,127,244,.13);}
  .card-body{flex:1;min-width:0;}
  .card-title{
    font-size:16px;font-weight:600;
    color:#eceef3;margin-bottom:3px;
  }
  .card-sub{
    font-size:12px;color:#5a6478;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .arrow{
    color:#2a3550;font-size:20px;flex-shrink:0;
    transition:color .15s;
  }
  .card:hover .arrow{color:#5b9cf6;}
  .footer{
    font-family:'Courier New',monospace;
    font-size:10px;color:#2a3550;
    margin-top:4px;letter-spacing:.04em;
  }
</style>
</head>
<body>

<div class="logo">
  <svg height="36" viewBox="0 0 42 40" fill="none" xmlns="http://www.w3.org/2000/svg">
    <circle cx="25" cy="20" r="12.5" stroke="#5b9cf6" stroke-width="2.2"/>
    <line x1="16" y1="6" x2="16" y2="34" stroke="#5b9cf6" stroke-width="2.2" stroke-linecap="round"/>
    <line x1="16" y1="34" x2="29" y2="34" stroke="#5b9cf6" stroke-width="2.2" stroke-linecap="round"/>
  </svg>
  <div class="logo-text">
    Lucas Olavarria
    <div class="logo-sub">Asesor Financiero · CNV 2062</div>
  </div>
</div>

<div class="cards">

  <a class="card c1" href="https://lucas29olavarria-art.github.io/Cartera/" target="_blank">
    <div class="icon">📊</div>
    <div class="card-body">
      <div class="card-title">Mi Cartera</div>
      <div class="card-sub">Ver mi portafolio personal</div>
    </div>
    <div class="arrow">›</div>
  </a>

  <a class="card c2" href="https://lucas29olavarria-art.github.io/Cartera/#import" target="_blank">
    <div class="icon">⬆</div>
    <div class="card-body">
      <div class="card-title">Importar datos</div>
      <div class="card-sub">Subir posiciones desde Inviu · Balanz · Olas</div>
    </div>
    <div class="arrow">›</div>
  </a>

  <a class="card c3" href="https://lucas29olavarria-art.github.io/Cartera/" target="_blank">
    <div class="icon">⚙️</div>
    <div class="card-body">
      <div class="card-title">Panel Admin</div>
      <div class="card-sub">Gestión de clientes · reportes · calendario</div>
    </div>
    <div class="arrow">›</div>
  </a>

</div>

<div class="footer">hub · uso personal</div>

</body>
</html>
