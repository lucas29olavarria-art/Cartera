html:not(.sb-ready){visibility:hidden}
/* Layout: juego a pantalla completa — barra arriba, cuarto isométrico al centro, accesos a los agentes abajo, panel tipo bottom sheet */
:root{
  --night:#0e131b; --night-2:#18202c;
  --panel:#27313d; --panel-2:#323e4c; --line:#465567;
  --header:#3a6ea5; --ink:#eef2f6; --muted:#a9b6c4;
  --gold:#f2c14e; --gold-ink:#2a2110; --ok:#5fc48a; --warn:#f08a5d;

  --body:"Atkinson Hyperlegible", system-ui, sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
[hidden]{display:none!important}
body{background:var(--night);color:var(--ink);font-family:var(--body);overflow:hidden}
.app{height:100%;display:flex;flex-direction:column}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  background:var(--panel);border-bottom:2px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand .mark{font-family:var(--display);font-weight:700;font-size:13px;color:var(--gold-ink);background:var(--gold);
  width:30px;height:30px;border-radius:8px;display:grid;place-items:center;flex:none}
.brand .word{min-width:0;line-height:1.25}
.brand .word b{display:block;font-family:var(--display);font-weight:700;font-size:17px;letter-spacing:.02em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.brand .word small{display:block;font-weight:400;font-size:12px;color:var(--muted);letter-spacing:.02em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tools{display:flex;align-items:center;gap:8px}
.tool{display:inline-flex;align-items:center;gap:6px;font-family:var(--display);font-size:13px;color:var(--ink);
  background:var(--panel-2);border:2px solid var(--line);border-radius:8px;padding:6px 10px;cursor:pointer;white-space:nowrap;text-decoration:none;position:relative}
.tool:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.tool.bell{font-size:16px;padding:6px 9px}
.tool.bell .badge{top:-6px;right:-6px}
.tool.clock{cursor:default;color:var(--gold);font-size:15px;font-variant-numeric:tabular-nums}
@media (max-width:480px){
  .top{gap:8px}
  .brand{flex:1 1 auto;min-width:0}
  .tools{flex:none}
  .brand .word small{display:none}
  .tool .lbl{display:none}
  .tool{padding:6px 9px}
}
.stage{flex:1;min-height:0;position:relative;
  background:radial-gradient(ellipse at 50% 40%, var(--night-2), var(--night) 70%)}
canvas{display:block;width:100%;height:100%;touch-action:manipulation}
.hint{position:absolute;left:50%;transform:translateX(-50%);bottom:10px;font-family:var(--display);font-size:13px;
  background:rgba(0,0,0,.45);color:var(--ink);padding:6px 12px;border-radius:4px;pointer-events:none;white-space:nowrap}
.dock{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;background:var(--panel);border-top:2px solid var(--line);
  padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.dock button{position:relative;font:inherit;color:var(--ink);background:var(--panel-2);border:2px solid var(--line);border-radius:6px;
  padding:6px 4px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;min-width:0}
.dock button:focus-visible,.btn:focus-visible,.x:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.dock button,.tool{transition:border-color .15s ease,transform .15s ease}
@media (hover:hover){.dock button:hover,.tool:hover{border-color:var(--gold)}.dock button:hover{transform:translateY(-2px)}}
.dock b{font-family:var(--display);font-size:14px;font-weight:600}
.dock span{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.dock i{font-style:normal;font-size:18px;line-height:1}

.homecard .hc-row i{font-style:normal;font-size:15px;width:18px;text-align:center}
.homecard .hc-row b{font-family:var(--display);font-size:16px;font-variant-numeric:tabular-nums}
.homecard .hc-row span{font-size:12px;color:var(--muted)}
.homecard .hc-ok{color:var(--ok);font-size:12px;margin-top:6px;font-family:var(--display)}

.sheet{position:absolute;left:0;right:0;bottom:0;max-height:78%;display:flex;flex-direction:column;background:var(--panel);

  transform:translateY(16px);opacity:0;pointer-events:none;transition:transform .22s ease,opacity .18s ease}
.sheet.show{transform:translateY(0);opacity:1;pointer-events:auto}

.sheet-h{display:flex;align-items:center;gap:12px;background:var(--header);padding-block:10px;

.sheet-h h2{margin:0;font-family:var(--display);font-size:20px;font-weight:700}

.x{font:inherit;background:rgba(0,0,0,.25);border:0;color:var(--ink);width:36px;height:36px;border-radius:6px;font-size:20px;cursor:pointer}
.sheet-b{overflow-y:auto;padding-block:14px 18px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));

.say{font-family:var(--display);font-size:15px;background:var(--panel-2);border:2px solid var(--line);border-radius:8px;padding:10px 12px;line-height:1.35}
.demo{font-size:12px;color:var(--warn);font-family:var(--display);letter-spacing:.04em;text-transform:uppercase}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{font:inherit;font-size:13px;color:var(--ink);background:var(--panel-2);border:2px solid var(--line);border-radius:6px;padding:6px 10px;cursor:pointer}
.tab[aria-pressed="true"]{background:var(--gold);color:var(--gold-ink);border-color:var(--gold)}
.msg{white-space:pre-wrap;font-size:14px;line-height:1.5;background:#0f1822;border:2px solid var(--line);border-radius:8px;padding:12px;margin:0;
  font-family:var(--body);max-width:65ch}
.btn{font-family:var(--display);font-size:15px;font-weight:600;background:var(--gold);color:var(--gold-ink);border:0;border-radius:6px;padding:9px 14px;cursor:pointer;align-self:flex-start}
.btn.ghost{background:transparent;color:var(--ink);border:2px solid var(--line)}
.row{display:flex;align-items:center;gap:10px;padding:10px;background:var(--panel-2);border-radius:8px;border-left:4px solid var(--line)}
.row.hot{border-left-color:var(--warn)} .row.mid{border-left-color:var(--gold)} .row.done{opacity:.5;border-left-color:var(--ok)}
.row .t{flex:1;min-width:0} .row .t b{display:block;font-size:15px} .row .t span{font-size:13px;color:var(--muted)}
.row .btn{padding:7px 10px;font-size:13px;flex:none}
h3{margin:4px 0 0;font-family:var(--display);font-size:16px;font-weight:600;color:var(--muted);letter-spacing:.03em}
.list{display:flex;flex-direction:column;gap:8px}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kpi{background:var(--panel-2);border-radius:8px;padding:10px}
.kpi span{display:block;font-size:12px;color:var(--muted)}
.kpi b{font-family:var(--display);font-size:18px;font-variant-numeric:tabular-nums}
.bar{display:grid;grid-template-columns:96px 1fr 70px;gap:8px;align-items:center;font-size:13px}
.bar i{display:block;height:12px;background:var(--header);border-radius:3px}
.bar em{font-style:normal;text-align:right;font-variant-numeric:tabular-nums;color:var(--muted)}
.note{font-size:13px;color:var(--muted);line-height:1.45}
.toast{position:absolute;top:12px;left:50%;transform:translateX(-50%);background:var(--ok);color:#06180d;font-family:var(--display);

@media (max-width:420px){.kpi b{font-size:15px}.bar{grid-template-columns:80px 1fr 60px}}
</style>
<script>
const SUPABASE_URL='https://vqxcmooloynecpvyeghv.supabase.co';
const SUPABASE_ANON_KEY='sb_publishable_DBhPfwrGlvI-41Cmo2NfKQ_WYdoGnT5';
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY,{auth:{persistSession:true}});
sb.auth.getSession().then(({data:{session}})=>{
  if(!session){location.replace('../index.html');return;}
  document.documentElement.classList.add('sb-ready');

});
sb.auth.onAuthStateChange((event,session)=>{
  if(event==='SIGNED_OUT'||(event!=='INITIAL_SESSION'&&!session))location.replace('../index.html');
});

// Datos reales para el panel de Zafira (el único agente ya conectado —
// Nova/Midas/Chispa siguen con datos de ejemplo hasta que les toque el turno).
const ZAFIRA_CONFIG_DEFAULT={dias_sin_contacto:45,dias_sin_deposito:90,dias_cobro_cerca:7,dias_reinversion:3,dias_cliente_nuevo:30};
let ZDB={clients:[],flows:[],contactos:[],config:ZAFIRA_CONFIG_DEFAULT,templates:{},alerts:[],ready:false};
function todayStrOf(){return new Date().toISOString().slice(0,10);}
function fmtDateShortOf(d){const dt=new Date(d+'T00:00:00');return String(dt.getDate()).padStart(2,'0')+'/'+String(dt.getMonth()+1).padStart(2,'0');}
function fmtMoneyOf(n,moneda){return(moneda==='USD'?'u$s ':'$ ')+Number(n).toLocaleString('es-AR');}
async function loadZafiraData(){
  const [clientsRes,flowsRes,contactosRes,advisorRes]=await Promise.all([
    sb.from('clients').select('*'),
    sb.from('flows').select('*'),
    sb.from('contactos').select('*'),
    sb.from('advisor_settings').select('*').maybeSingle(),
  ]);
  if(clientsRes.error||flowsRes.error||contactosRes.error)return; // se queda con datos de ejemplo si falla
  ZDB.clients=(clientsRes.data||[]).map(r=>({id:r.id,name:r.name,createdAt:r.created_at?r.created_at.slice(0,10):todayStrOf(),
    birthday:r.birthday||null,ultimoDeposito:r.ultimo_deposito||null}));
  ZDB.flows=(flowsRes.data||[]).map(r=>({id:r.id,clientId:r.client_id,ticker:r.ticker,fecha:r.fecha,monto:+r.monto,moneda:r.moneda,cobrado:!!r.cobrado}));
  ZDB.contactos=(contactosRes.data||[]).map(r=>({id:r.id,clientId:r.client_id,fecha:r.fecha}));
  ZDB.config=advisorRes.data?.zafira_config||ZAFIRA_CONFIG_DEFAULT;
  ZDB.templates=advisorRes.data?.zafira_templates||{};
  ZDB.alerts=computeZafira(ZDB.clients,ZDB.flows,ZDB.contactos,{...ZDB.config,templates:ZDB.templates},todayStrOf());
  ZDB.ready=true;
  if(typeof renderDock==='function'){renderDock();renderHoyBtn();if(current&&current.key==='secre')render(current);}
}
async function zafiraRegistrarContacto(clientId){
  const row={id:crypto.randomUUID?crypto.randomUUID():'id-'+Date.now(),client_id:clientId,fecha:new Date().toISOString(),canal:'whatsapp'};
  const{error}=await sb.from('contactos').insert(row);
  if(error){toast('No se pudo guardar — reintentá');return;}
  toast('Anotado ✓');
  await loadZafiraData();
  if(current&&current.key==='secre')render(current);
  renderDock();renderHoyBtn();
}
</script>

const player={x:6.5,y:7.5,path:[],dir:1,target:null};

// ---------- Canvas ----------
const cv=document.getElementById("cv");let ctx=cv.getContext("2d");
let scale=1,offX=0,offY=0,dpr=1,fit=1,zoom=false,cw=0,ch=0;
function resize(){
  const r=cv.getBoundingClientRect();dpr=Math.min(window.devicePixelRatio||1,2);cw=r.width;ch=r.height;
  cv.width=Math.round(r.width*dpr);cv.height=Math.round(r.height*dpr);
  fit=Math.min(r.width/WORLD_W,r.height/WORLD_H);
}
window.addEventListener("resize",resize);
function camera(){
  scale=zoom?Math.max(fit*2,0.9):fit;
  const ww=WORLD_W*scale,wh=WORLD_H*scale;
  if(!zoom||ww<=cw){offX=(cw-ww)/2;} else {const [px]=iso(player.x,player.y);offX=Math.min(0,Math.max(cw-ww,cw/2-px*scale));}
  if(!zoom||wh<=ch){offY=(ch-wh)/2;} else {const [,py]=iso(player.x,player.y);offY=Math.min(0,Math.max(ch-wh,ch/2-(py-40)*scale));}
}

function poly(pts,fill,stroke,lw){ctx.beginPath();pts.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));ctx.closePath();
  if(fill){ctx.fillStyle=fill;ctx.fill();}if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=lw||1;ctx.stroke();}}
function shade(hex,f){const n=parseInt(hex.slice(1),16);let r=n>>16,g=n>>8&255,b=n&255;
  r=Math.max(0,Math.min(255,Math.round(r*f)));g=Math.max(0,Math.min(255,Math.round(g*f)));b=Math.max(0,Math.min(255,Math.round(b*f)));
  return "#"+((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1);}
function mix(hexA,hexB,t){const a=parseInt(hexA.slice(1),16),b=parseInt(hexB.slice(1),16);
  const ar=a>>16,ag=a>>8&255,ab=a&255,br=b>>16,bg=b>>8&255,bb=b&255;
  const r=Math.round(ar+(br-ar)*t),g=Math.round(ag+(bg-ag)*t),bl=Math.round(ab+(bb-ab)*t);
  return "#"+((1<<24)+(r<<16)+(g<<8)+bl).toString(16).slice(1);}
function hash2(x,y){const s=Math.sin(x*127.1+y*311.7)*43758.5453;return s-Math.floor(s);}
function lerpPt(p,q,t){return [p[0]+(q[0]-p[0])*t,p[1]+(q[1]-p[1])*t];}
// Luz única desde el ventanal (pared y=0, cerca de x≈9) — piso, muebles y
// paredes consultan esta misma fuente, en vez de la viñeta desacoplada
// que había antes (ambientLight ya no hace todo el trabajo sola).
const LIGHT_X=8.9, LIGHT_Y=-0.6;
function lightAt(gx,gy){const dx=gx-LIGHT_X,dy=(gy-LIGHT_Y)*1.35;const d=Math.sqrt(dx*dx+dy*dy);return Math.max(0,1-d/13);}
function shadowOffsetFor(gx,gy){const dx=gx-LIGHT_X,dy=gy-LIGHT_Y;const d=Math.hypot(dx,dy)||1;return [dx/d*0.32,dy/d*0.32];}
function drawFloorShadow(cx,cy,size,L){
  const [ox,oy]=shadowOffsetFor(cx,cy);
  const p=iso(cx+ox,cy+oy);
  ctx.save();ctx.globalAlpha=0.14+(1-L)*0.08;ctx.fillStyle="#05070b";
  ctx.beginPath();ctx.ellipse(p[0],p[1]+3,size*26,size*13,0,0,7);ctx.fill();ctx.restore();
}
function gradFace(p1,p2,p3,p4,colBottom,colTop){
  const g=ctx.createLinearGradient(p1[0],p1[1],p4[0],p4[1]);
  g.addColorStop(0,colBottom);g.addColorStop(1,colTop);
  poly([p1,p2,p3,p4],g);
}
// esquinas redondeadas — para que muebles y personajes dejen de leer como
// bloques de píxeles con cantos de 90°.
function roundRectPath(x,y,w,h,r){
  ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();
}
function roundedPoly(pts,r,fill,stroke,lw){
  ctx.beginPath();const n=pts.length;
  for(let i=0;i<n;i++){
    const p0=pts[(i-1+n)%n],p1=pts[i],p2=pts[(i+1)%n];
    const v1x=p1[0]-p0[0],v1y=p1[1]-p0[1],d1=Math.hypot(v1x,v1y)||1;
    const v2x=p2[0]-p1[0],v2y=p2[1]-p1[1],d2=Math.hypot(v2x,v2y)||1;
    const rr=Math.min(r,d1/2,d2/2);
    const a=[p1[0]-v1x/d1*rr,p1[1]-v1y/d1*rr],b=[p1[0]+v2x/d2*rr,p1[1]+v2y/d2*rr];
    if(i===0)ctx.moveTo(a[0],a[1]);else ctx.lineTo(a[0],a[1]);
    ctx.quadraticCurveTo(p1[0],p1[1],b[0],b[1]);
  }
  ctx.closePath();
  if(fill){ctx.fillStyle=fill;ctx.fill();}
  if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=lw||1;ctx.stroke();}
}
// caja isométrica: x0,y0 esquina, dx,dy tamaño en tiles, h alto, lift elevación
function box(x0,y0,dx,dy,h,col,lift=0,top){
  const a=iso(x0,y0),b=iso(x0+dx,y0),c=iso(x0+dx,y0+dy),d=iso(x0,y0+dy);
  const up=p=>[p[0],p[1]-h-lift], lo=p=>[p[0],p[1]-lift];
  const cx=x0+dx/2,cy=y0+dy/2,L=lightAt(cx,cy);
  if(!lift)drawFloorShadow(cx,cy,Math.max(dx,dy),L);
  gradFace(lo(d),lo(c),up(c),up(d),shade(col,.56),shade(col,.74));
  gradFace(lo(c),lo(b),up(b),up(c),shade(col,.78),shade(col,.94));
  const topCol=mix(top||col,"#ffdfa3",0.08+L*0.26);
  const topR=Math.min(6,Math.max(dx,dy)*TW*0.1);
  roundedPoly([up(a),up(b),up(c),up(d)],topR,topCol,shade(topCol,.72),1);
}
// dibujar en el plano de una pared: "L" = pared izquierda (x=0), "R" = pared derecha (y=0)
function onWall(side,t,fn){const p=side==="L"?iso(0,t):iso(t,0);ctx.save();
  ctx.transform(1,side==="L"?-0.5:0.5,0,1,p[0],p[1]);fn();ctx.restore();}

function drawRoom(t){
  const p00=iso(0,0),p0H=iso(0,H),pW0=iso(W,0),pWH=iso(W,H);
  // paredes — degradé sutil (más luz rebotada cerca del piso) en vez de
  // un relleno plano único.
  {
    const gL=ctx.createLinearGradient(p0H[0],p0H[1]-WALLH,p0H[0],p0H[1]);
    gL.addColorStop(0,"#1d2330");gL.addColorStop(1,"#2a3240");
    poly([p0H,p00,[p00[0],p00[1]-WALLH],[p0H[0],p0H[1]-WALLH]],gL);
    const gR=ctx.createLinearGradient(p00[0],p00[1]-WALLH,p00[0],p00[1]);
    gR.addColorStop(0,"#24293a");gR.addColorStop(1,"#343f54");
    poly([p00,pW0,[pW0[0],pW0[1]-WALLH],[p00[0],p00[1]-WALLH]],gR);
  }
  poly([p0H,p00,[p00[0],p00[1]-10],[p0H[0],p0H[1]-10]],"#5a4330");
  poly([p00,pW0,[pW0[0],pW0[1]-10],[p00[0],p00[1]-10]],"#6b5038");
  // cantos superiores
  poly([[p0H[0],p0H[1]-WALLH],[p00[0],p00[1]-WALLH],[p00[0],p00[1]-WALLH-8],[p0H[0]+8,p0H[1]-WALLH-4]],"#3a4456");
  poly([[p00[0],p00[1]-WALLH],[pW0[0],pW0[1]-WALLH],[pW0[0]-8,pW0[1]-WALLH-4],[p00[0],p00[1]-WALLH-8]],"#46516a");

  // marca en la pared izquierda
  const L=32; // px por tile a lo largo de la pared
  onWall("L",9.2,()=>{
    // monograma
    ctx.fillStyle="#e9ecef";ctx.fillRect(0,-104,30,30);
    ctx.fillStyle="#232a37";ctx.font="700 17px 'Pixelify Sans', monospace";ctx.textAlign="center";ctx.textBaseline="middle";ctx.fillText("LO",15,-88);
    ctx.textAlign="left";ctx.textBaseline="alphabetic";
    ctx.fillStyle="#eef1f4";ctx.font="700 30px 'Pixelify Sans', monospace";ctx.fillText("LUCAS",40,-82);
    ctx.font="700 30px 'Pixelify Sans', monospace";ctx.fillText("OLAVARRIA",40,-52);
    ctx.fillStyle="#f2c14e";ctx.font="600 12px 'Pixelify Sans', monospace";ctx.fillText("ASESOR FINANCIERO · IDÓNEO CNV",42,-34);
  });
  // puerta de entrada (vidrio) en la pared izquierda
  onWall("L",11.5,()=>{const w=1.7*L;
    ctx.fillStyle="#141a24";ctx.fillRect(-2,-102,w+4,102);
    ctx.fillStyle="rgba(140,190,220,.28)";ctx.fillRect(3,-97,w-6,95);
    ctx.fillStyle="rgba(255,255,255,.18)";ctx.fillRect(8,-90,4,70);
    ctx.fillStyle="#9aa6b5";ctx.fillRect(w-12,-52,3,14);});
  // frase en la pared derecha
  onWall("R",3.0,()=>{ctx.fillStyle="#c9d1db";ctx.font="600 11px 'Pixelify Sans', monospace";
    ["MEJORES","DECISIONES.","MÁS","OPORTUNIDADES."].forEach((s,i)=>ctx.fillText(s,4,-108+i*15));});
  // ventanal con skyline porteño — atardecer cálido con más densidad de
  // luces y un halo real detrás del Obelisco, en vez de rectángulos planos.
  onWall("R",6.1,()=>{const w=5.6*L,top=-122,bot=-14,hh=bot-top;
    ctx.fillStyle="#141a24";ctx.fillRect(-4,top-4,w+8,hh+8);
    const g=ctx.createLinearGradient(0,top,0,bot);
    g.addColorStop(0,"#4c6fa3");g.addColorStop(.38,"#8fa4c9");g.addColorStop(.68,"#e3b9a8");g.addColorStop(1,"#f6d9a0");
    ctx.fillStyle=g;ctx.fillRect(0,top,w,hh);
    const sun=ctx.createRadialGradient(w*.82,top+26,2,w*.82,top+26,30);
    sun.addColorStop(0,"rgba(255,244,210,.9)");sun.addColorStop(1,"rgba(255,244,210,0)");
    ctx.fillStyle=sun;ctx.fillRect(w*.82-30,top-4,60,60);
    ctx.fillStyle="rgba(255,255,255,.7)";[[20,top+18,26],[95,top+12,34]].forEach(([x,y,l])=>{ctx.fillRect(x,y,l,4);ctx.fillRect(x+6,y-3,l-12,3);});
    const B=[[-4,46,"#5f779e"],[8,66,"#52688e"],[22,40,"#718aad"],[34,76,"#4a6286"],[50,54,"#64799f"],[64,36,"#7c93b5"],[80,62,"#566d95"],
      [100,48,"#6a81a7"],[114,72,"#4e6588"],[128,42,"#768cb0"],[142,58,"#5b7399"],[156,80,"#45597e"],[168,38,"#8094b8"]];
    B.forEach(([x,hb,c])=>{ctx.fillStyle=c;ctx.fillRect(x,bot-hb,13,hb);
      for(let yy=bot-hb+5;yy<bot-4;yy+=7)for(let xx=x+2;xx<x+11;xx+=4)if((xx*7+yy*3)%5){
        const lit=(xx*13+yy*7)%3===0;
        ctx.fillStyle=lit?"rgba(255,224,150,.92)":"rgba(255,236,170,.4)";
        ctx.fillRect(xx,yy,2,3);
      }});
    // halo cálido detrás del Obelisco
    const ox=w*.55;
    const halo=ctx.createRadialGradient(ox,bot-60,4,ox,bot-60,70);
    halo.addColorStop(0,"rgba(255,214,150,.35)");halo.addColorStop(1,"rgba(255,214,150,0)");
    ctx.fillStyle=halo;ctx.fillRect(ox-70,bot-130,140,130);
    // Obelisco
    ctx.fillStyle="#eef0ec";ctx.fillRect(ox-4,bot-88,8,88);ctx.beginPath();ctx.moveTo(ox-4,bot-88);ctx.lineTo(ox,bot-100);ctx.lineTo(ox+4,bot-88);ctx.fill();
    ctx.fillStyle="#c9ccc6";ctx.fillRect(ox+1,bot-88,3,88);ctx.fillStyle="#1d2633";ctx.fillRect(ox-1,bot-80,2,3);
    ctx.fillStyle=`rgba(255,120,90,${.55+.35*Math.sin(t/500)})`;ctx.fillRect(ox-1,bot-101,2,2);
    ctx.fillStyle="#141a24";[w/3,2*w/3].forEach(x=>ctx.fillRect(x-2,top,4,hh));ctx.fillRect(0,top+hh*.62,w,3);
    ctx.fillStyle="rgba(255,255,255,.08)";ctx.beginPath();ctx.moveTo(10,bot);ctx.lineTo(40,top);ctx.lineTo(60,top);ctx.lineTo(30,bot);ctx.fill();
  });
  // cuadro con gráfico en la pared izquierda
  onWall("L",2.7,()=>{ctx.fillStyle="#3b2c20";ctx.fillRect(0,-104,80,58);ctx.fillStyle="#1b2433";ctx.fillRect(4,-100,72,50);
    ctx.strokeStyle="#5fc48a";ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(10,-60);ctx.lineTo(26,-70);ctx.lineTo(38,-64);ctx.lineTo(54,-84);ctx.lineTo(70,-90);ctx.stroke();
    ctx.fillStyle="#c9d1db";ctx.font="9px 'Pixelify Sans', monospace";ctx.fillText("AUM",10,-90);});

  // piso — madera cálida con veta y variación por tabla en planta abierta,
  // porcelanato oscuro en la sala de reuniones; ambos responden a la misma
  // luz de ventana que el resto de la escena (lightAt), no son un color fijo.
  for(let x=0;x<W;x++)for(let y=0;y<H;y++){
    const a=iso(x,y),b=iso(x+1,y),c=iso(x+1,y+1),d=iso(x,y+1);
    const meet=x>=8&&y>=6;
    const L=lightAt(x+0.5,y+0.5);
    if(meet){
      const n=hash2(x*2+5,y*2+11);
      const base=(x+y)%2?"#3a4456":"#404b5e";
      const col=mix(shade(base,0.92+n*0.12),"#f4d9a0",L*0.1);
      poly([a,b,c,d],col,"rgba(20,26,36,.3)",1);
    } else {
      const plankBase=y%2?"#a9875a":"#9e7c4f";
      const n=hash2(x,y);
      const col=mix(shade(plankBase,0.88+n*0.2),"#ffe3ab",0.1+L*0.3);
      poly([a,b,c,d],col,"rgba(58,38,18,.13)",1);
      if(hash2(x+50,y+50)>0.42){
        const tt=0.28+hash2(x+99,y+13)*0.44;
        const g1=lerpPt(a,d,tt),g2=lerpPt(b,c,tt);
        ctx.strokeStyle="rgba(50,32,16,.24)";ctx.lineWidth=1;
        ctx.beginPath();ctx.moveTo(g1[0],g1[1]);ctx.lineTo(g2[0],g2[1]);ctx.stroke();
      }
    }
  }
  // alfombras
  const rug=(x0,y0,x1,y1,c,e)=>{poly([iso(x0,y0),iso(x1,y0),iso(x1,y1),iso(x0,y1)],c,e,2);};
  rug(3.2,8.6,6.9,11.8,"#5c6676","#8a93a1");
  rug(0.15,9.9,1.1,11.4,"#1b212c","#2f3846");
  rug(3.4,1.4,7.6,5.6,"rgba(70,80,96,.35)");
  // espesor del piso
  poly([p0H,pWH,[pWH[0],pWH[1]+12],[p0H[0],p0H[1]+12]],"#5a4330");
  poly([pWH,pW0,[pW0[0],pW0[1]+12],[pWH[0],pWH[1]+12]],"#6b5038");
}

  [[0,-26,10],[-9,-20,7],[9,-20,7],[0,-36,7],[-5,-30,6],[6,-31,6]].forEach(([dx,dy,r])=>{ctx.beginPath();ctx.arc(cx+dx*s,cy+dy*s,r*s,0,7);ctx.fill();});
  ctx.fillStyle="#4aa765";[[-3,-30,4],[5,-24,3],[-7,-21,3]].forEach(([dx,dy,r])=>{ctx.beginPath();ctx.arc(cx+dx*s,cy+dy*s,r*s,0,7);ctx.fill();});}

      {const s=iso(x+0.47,y+0.6);ctx.fillStyle="#f2c14e";ctx.fillRect(s[0]-1,s[1]-36,3,2);}break;
  }
}
function drawGlass(g){
  const h=96;let a,b;
  if(g.ax==="x"){a=iso(g.x,g.y);b=iso(g.x,g.y+1);} else {a=iso(g.x,g.y);b=iso(g.x+1,g.y);}
  ctx.strokeStyle="#2b3240";ctx.lineWidth=3;
  if(g.door){ctx.beginPath();ctx.moveTo(a[0],a[1]-h);ctx.lineTo(b[0],b[1]-h);ctx.stroke();return;}
  const L=lightAt(g.x,g.y); // vidrio más cálido/luminoso cuanto más cerca del ventanal
  poly([a,b,[b[0],b[1]-h],[a[0],a[1]-h]],`rgba(${160+Math.round(L*40)},${205+Math.round(L*20)},${225+Math.round(L*10)},${(0.13+L*0.08).toFixed(2)})`);
  ctx.beginPath();ctx.moveTo(a[0],a[1]);ctx.lineTo(b[0],b[1]);ctx.moveTo(a[0],a[1]-h);ctx.lineTo(b[0],b[1]-h);
  ctx.moveTo(a[0],a[1]);ctx.lineTo(a[0],a[1]-h);ctx.stroke();
  ctx.strokeStyle=`rgba(255,255,255,${(0.16+L*0.14).toFixed(2)})`;ctx.lineWidth=2;ctx.beginPath();
  ctx.moveTo(a[0]+(b[0]-a[0])*.3,a[1]+(b[1]-a[1])*.3-20);ctx.lineTo(a[0]+(b[0]-a[0])*.5,a[1]+(b[1]-a[1])*.5-70);ctx.stroke();
}

function drawPerson(fx,fy,p,t,walking,faceLeft){
  const bob=walking?Math.abs(Math.sin(t/90))*2:Math.sin(t/600)*0.8;
  const shGrad=ctx.createRadialGradient(fx,fy,0,fx,fy,13);
  shGrad.addColorStop(0,"rgba(0,0,0,.32)");shGrad.addColorStop(1,"rgba(0,0,0,0)");
  ctx.fillStyle=shGrad;ctx.beginPath();ctx.ellipse(fx,fy,12,5,0,0,7);ctx.fill();
  const y=fy-bob,step=walking?Math.sin(t/90)*3:0;

  // piernas y pies — cápsulas redondeadas en vez de rectángulos con canto vivo
  ctx.fillStyle=p.pants||"#2c3442";
  roundRectPath(fx-6,y-14+step*0.3,5,13,2.3);ctx.fill();
  roundRectPath(fx+1,y-14-step*0.3,5,13,2.3);ctx.fill();
  ctx.fillStyle=p.shoes||"#e9ecef";
  roundRectPath(fx-7,y-2+step*0.3,6,4,2);ctx.fill();
  roundRectPath(fx+1,y-2-step*0.3,6,4,2);ctx.fill();

  // torso — silueta redondeada; el resto del detalle (bandas, corbata, filo
  // iluminado) se recorta adentro, así conserva el shading que ya teníamos.
  ctx.save();
  roundRectPath(fx-8,y-30,16,17,5);ctx.clip();
  ctx.fillStyle=p.shirt;ctx.fillRect(fx-8,y-30,16,17);
  ctx.fillStyle=shade(p.shirt,.8);ctx.fillRect(fx-8,y-16,16,3);ctx.fillRect(fx-2,y-30,4,3);
  if(p.stripes){ctx.fillStyle="#f2c14e";ctx.fillRect(fx-8,y-25,16,3);ctx.fillRect(fx-8,y-19,16,2);}
  if(p.tie){ctx.fillStyle=p.tie;ctx.fillRect(fx-1,y-29,3,15);ctx.fillStyle=shade(p.tie,.7);ctx.fillRect(fx-1,y-29,3,2);}
  ctx.fillStyle=shade(p.shirt,1.22);ctx.fillRect(fx+6,y-29,2,16); // filo iluminado, lado ventana
  ctx.restore();
  ctx.fillStyle=shade(p.shirt,.85);
  roundRectPath(fx-11,y-29,3,12,1.4);ctx.fill();roundRectPath(fx+8,y-29,3,12,1.4);ctx.fill();
  ctx.fillStyle=p.skin;
  roundRectPath(fx-11,y-18,3,3,1.3);ctx.fill();roundRectPath(fx+8,y-18,3,3,1.3);ctx.fill();
  // credencial — detalle que comparten los cuatro, suma a la identidad "de estudio"
  ctx.fillStyle="#9aa6b5";ctx.fillRect(fx-1,y-27,1,6);
  ctx.fillStyle="#f2c14e";roundRectPath(fx-3,y-21,6,5,1.2);ctx.fill();
  ctx.fillStyle="rgba(0,0,0,.22)";ctx.fillRect(fx-3,y-21,6,1);

  // cabeza — círculo real, no un cuadrado con pelo arriba
  const hx=fx,hy=y-37,hr=8,ex=faceLeft?-2:2;
  ctx.fillStyle=p.skin;ctx.beginPath();ctx.ellipse(hx,hy,hr,hr,0,0,7);ctx.fill();
  ctx.save();ctx.beginPath();ctx.ellipse(hx,hy,hr,hr,0,0,7);ctx.clip();
  ctx.fillStyle="#1a1a1a";
  ctx.beginPath();ctx.ellipse(fx-3+ex,y-37,1.3,1.6,0,0,7);ctx.fill();
  ctx.beginPath();ctx.ellipse(fx+3+ex,y-37,1.3,1.6,0,0,7);ctx.fill();
  ctx.fillStyle=shade(p.skin,.8);ctx.beginPath();ctx.ellipse(fx-2+ex,y-32.5,2.2,1,0,0,7);ctx.fill();
  if(p.glasses){ctx.strokeStyle="#1a1a1a";ctx.lineWidth=1;ctx.beginPath();ctx.ellipse(fx-3+ex,y-37,2.4,2.1,0,0,7);ctx.stroke();ctx.beginPath();ctx.ellipse(fx+3+ex,y-37,2.4,2.1,0,0,7);ctx.stroke();}
  ctx.restore();
  // pelo — cúpula redondeada sobre la cabeza en vez de una tapa plana
  ctx.fillStyle=p.hair;
  if(p.hairStyle==="cap"){
    ctx.fillStyle="#3a6ea5";ctx.beginPath();ctx.ellipse(hx,hy-2,hr+0.5,hr-1,0,Math.PI,0);ctx.fill();
    ctx.fillRect(faceLeft?hx-hr-3:hx+hr-6,hy-4,9,3);
  } else {
    ctx.beginPath();ctx.ellipse(hx,hy-1.5,hr+0.5,hr-0.5,0,Math.PI,0);ctx.fill();
    ctx.fillRect(hx-hr,hy-2,3,6);ctx.fillRect(hx+hr-3,hy-2,3,5);
    if(p.hairStyle==="long"){roundRectPath(hx-hr,hy,3,15,1.5);ctx.fill();roundRectPath(hx+hr-3,hy,3,15,1.5);ctx.fill();}
    if(p.hairStyle==="curly"){[-7,-2,3,8].forEach(d=>{ctx.beginPath();ctx.arc(hx+d-1,hy-5,4,0,7);ctx.fill();});
      roundRectPath(hx-hr-1,hy-1,3,10,1.5);ctx.fill();roundRectPath(hx+hr-2,hy-1,3,10,1.5);ctx.fill();}
  }
  ctx.fillStyle=shade(p.hair,1.35);ctx.beginPath();ctx.ellipse(hx+5,hy-6,2,1.6,.5,0,7);ctx.fill(); // brillito, lado iluminado
  if(p.headset){ctx.fillStyle="#1a1f28";roundRectPath(hx-hr-1,hy-4,3,6,1.3);ctx.fill();
    ctx.beginPath();ctx.ellipse(hx,hy-hr-1,hr+1,3,0,Math.PI,0);ctx.fill();roundRectPath(hx-hr+1,hy+2,6,1.5,.7);ctx.fill();}

  // accesorios que cuentan quién es cada agente, más allá del color de remera
  if(p.prop==="tablet"){roundRectPath(fx+8,y-25,7,9,1.5);ctx.fillStyle="#1f2530";ctx.fill();roundRectPath(fx+9,y-24,5,4,.8);ctx.fillStyle="#4f9fd6";ctx.fill();}
  if(p.prop==="notepad"){roundRectPath(fx+8,y-23,6,8,1);ctx.fillStyle="#e9e2d0";ctx.fill();ctx.strokeStyle="#9a8f78";ctx.lineWidth=1;ctx.strokeRect(fx+8.5,y-22,5,1.5);ctx.strokeRect(fx+8.5,y-19,5,1.5);}
  if(p.prop==="megaphone"){ctx.fillStyle=p.accent||"#d9683a";ctx.beginPath();ctx.moveTo(fx+8,y-21);ctx.lineTo(fx+15,y-25);ctx.lineTo(fx+15,y-16);ctx.closePath();ctx.fill();roundRectPath(fx+6,y-20,3,3,1);ctx.fillStyle="#2b2f37";ctx.fill();}
}

function nameTag(x,y,txt,color){
  ctx.font="600 11px 'Pixelify Sans', monospace";const w=ctx.measureText(txt).width+10;
  ctx.fillStyle="rgba(15,22,30,.8)";ctx.fillRect(x-w/2,y-9,w,15);
  ctx.fillStyle=color||"#eef2f6";ctx.textAlign="center";ctx.textBaseline="middle";ctx.fillText(txt,x,y-1);
}
function bubble(x,y,txt,t){
  const by=y+Math.sin(t/400)*2;
  ctx.font="12px 'Pixelify Sans', monospace";const w=ctx.measureText(txt).width+16;
  ctx.fillStyle="#fffdf6";ctx.strokeStyle="#1d2633";ctx.lineWidth=2;
  ctx.beginPath();ctx.roundRect(x-w/2,by-22,w,20,5);ctx.fill();ctx.stroke();
  ctx.beginPath();ctx.moveTo(x-4,by-2);ctx.lineTo(x,by+4);ctx.lineTo(x+4,by-2);ctx.fill();
  ctx.fillStyle="#1d2633";ctx.textAlign="center";ctx.textBaseline="middle";ctx.fillText(txt,x,by-11);
}

// ---------- Movimiento ----------
function bfs(sx,sy,goals){
  const goalSet=new Set(goals.map(g=>key(g[0],g[1])));
  const q=[[sx,sy]],prev={};prev[key(sx,sy)]=null;
  while(q.length){const [x,y]=q.shift();if(goalSet.has(key(x,y))){const path=[];let k=key(x,y);
      while(k){const [a,b]=k.split(",").map(Number);path.unshift([a,b]);k=prev[k];}path.shift();return path;}
    for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){const nx=x+dx,ny=y+dy,k=key(nx,ny);
      if(nx<0||ny<0||nx>=W||ny>=H||blocked.has(k)||k in prev||edgeBlock.has(ek(x,y,nx,ny)))continue;prev[k]=key(x,y);q.push([nx,ny]);}}
  return null;
}
function walkTo(goals,agent){
  const sx=Math.round(player.x-0.5),sy=Math.round(player.y-0.5);
  const path=bfs(sx,sy,goals);
  if(!path)return;
  player.path=path;player.target=agent||null;
  marker=path.length?path[path.length-1]:null;
  if(!path.length&&agent)arriveAt(agent);
}
function arriveAt(a){
  if(a.despacho)location.href="../index.html";
  else openAgent(a);
}
function goToAgent(a){
  const n=([x,y])=>[[x+1,y],[x-1,y],[x,y+1],[x,y-1]];
  const goals=[...n(a.desk),...n([a.gx,a.gy])].filter(([x,y])=>x>=0&&y>=0&&x<W&&y<H&&!blocked.has(key(x,y)));
  closeSheet();walkTo(goals,a);
}
function goToDespacho(){
  // El despacho es un cuarto cerrado (puerta en el lateral oeste) — a
  // diferencia de un escritorio en planta abierta, no cualquier tile
  // vecino sirve de meta: solo el piso de adentro, para que camine por
  // la puerta y no "llegue" parado del otro lado del vidrio.
  const goals=[[8,0],[9,1]].filter(([x,y])=>!blocked.has(key(x,y)));
  closeSheet();walkTo(goals,DESPACHO);
}

function screenToWorld(e){const r=cv.getBoundingClientRect();return[(e.clientX-r.left-offX)/scale,(e.clientY-r.top-offY)/scale];}
cv.addEventListener("pointerdown",e=>{
  const [wx,wy]=screenToWorld(e);
  {const [fx,fy]=iso(DESPACHO.desk[0]+.5,DESPACHO.desk[1]+.5);if(Math.abs(wx-fx)<26&&wy<fy+12&&wy>fy-36){goToDespacho();return;}}
  for(const a of AGENTS){const [fx,fy]=iso(a.gx+.5,a.gy+.5);if(Math.abs(wx-fx)<16&&wy<fy+4&&wy>fy-60){goToAgent(a);return;}}
  for(const a of AGENTS){const [fx,fy]=iso(a.desk[0]+.5,a.desk[1]+.5);if(Math.abs(wx-fx)<26&&wy<fy+12&&wy>fy-36){goToAgent(a);return;}}
  const sx=wx-OX,sy=wy-OY;const gx=Math.floor((sx/(TW/2)+sy/(TH/2))/2),gy=Math.floor((sy/(TH/2)-sx/(TW/2))/2);
  if(gx<0||gy<0||gx>=W||gy>=H||blocked.has(key(gx,gy)))return;
  closeSheet();walkTo([[gx,gy]],null);
});

document.getElementById("zoom").onclick=e=>{zoom=!zoom;setZoomBtn(e.currentTarget);};

// ---------- Loop ----------
let last=performance.now();
const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
const ME={shirt:"#20324d",stripes:true,hair:"#3b2416",skin:"#e2b48c",hairStyle:"cap",pants:"#3a3f4a"};
// La luz "de verdad" ya la aportan el piso y los muebles vía lightAt() —
// esto solo agrega una viñeta leve para profundidad en los bordes y un
// resplandor chico pegado al vidrio para vender que la luz entra por ahí.
function ambientLight(){
  const cx=WORLD_W/2, cy=WORLD_H/2-20;
  const vg=ctx.createRadialGradient(cx,cy,Math.min(WORLD_W,WORLD_H)*.3,cx,cy,Math.max(WORLD_W,WORLD_H)*.66);
  vg.addColorStop(0,"rgba(0,0,0,0)");vg.addColorStop(1,"rgba(5,8,14,.28)");
  ctx.fillStyle=vg;ctx.fillRect(0,0,WORLD_W,WORLD_H);
  const [wx,wy]=iso(9,-0.1);
  const gl=ctx.createRadialGradient(wx,wy-120,4,wx,wy-120,170);
  gl.addColorStop(0,"rgba(255,222,150,.22)");gl.addColorStop(1,"rgba(255,222,150,0)");
  ctx.fillStyle=gl;ctx.fillRect(0,0,WORLD_W,WORLD_H);
}
function frame(t){
  const dt=Math.min(50,t-last);last=t;
  if(player.path.length){const [nx,ny]=player.path[0];const tx=nx+.5,ty=ny+.5;const dx=tx-player.x,dy=ty-player.y;const d=Math.hypot(dx,dy);
    const sp=(reduce?6:3.4)*dt/1000;
    if(d<=sp){player.x=tx;player.y=ty;player.path.shift();if(!player.path.length){marker=null;if(player.target){const a=player.target;player.target=null;arriveAt(a);}}}
    else{player.x+=dx/d*sp;player.y+=dy/d*sp;player.dir=(dx-dy)<0?-1:1;}}
  camera();
  ctx.setTransform(1,0,0,1,0,0);ctx.clearRect(0,0,cv.width,cv.height);
  ctx.setTransform(dpr*scale,0,0,dpr*scale,dpr*offX,dpr*offY);
  drawRoom(t);
  if(marker){const [x,y]=marker;ctx.globalAlpha=.5+.3*Math.sin(t/150);poly([iso(x,y),iso(x+1,y),iso(x+1,y+1),iso(x,y+1)],"rgba(242,193,78,.5)","#f2c14e");ctx.globalAlpha=1;}
  const items=[];
  FURN.forEach(f=>items.push({d:f.gx+f.gy+0.55,draw:()=>drawFurn(f,t)}));
  GLASS.forEach(g=>items.push({d:g.ax==="x"?g.x+g.y:g.x+g.y+0.0,draw:()=>drawGlass(g)}));
  AGENTS.forEach(a=>items.push({d:a.gx+a.gy+0.5,draw:()=>{const [fx,fy]=iso(a.gx+.5,a.gy+.5);drawPerson(fx,fy,a,t,false,false);}}));
  const walking=player.path.length>0;
  items.push({d:player.x+player.y-0.5+0.01,draw:()=>{const [fx,fy]=iso(player.x,player.y);drawPerson(fx,fy,ME,t,walking,player.dir<0);}});
  items.sort((a,b)=>a.d-b.d).forEach(i=>i.draw());
  ambientLight();
  AGENTS.forEach(a=>{const [fx,fy]=iso(a.gx+.5,a.gy+.5);nameTag(fx,fy-64,a.name+" · "+a.role);bubble(fx,fy-76,a.status(),t+a.gx*300);});
  {const [fx,fy]=iso(DESPACHO.desk[0]+.5,DESPACHO.desk[1]+.5);nameTag(fx,fy-46,"Mi despacho → CRM","#5fc48a");}
  {const [fx,fy]=iso(player.x,player.y);nameTag(fx,fy-62,"Capocha","#f2c14e");}
  requestAnimationFrame(frame);
}

function openAgent(a){current=a;render(a);showSheet();body.scrollTop=0;renderDock();}
// "Hoy": acceso directo en la barra superior a lo mismo que ve Zafira — no
// es un agente nuevo, es un atajo al mismo dato (a quién contactar hoy).
function openHoy(){
  const zafira=AGENTS.find(a=>a.key==="secre");
  const hoy={...zafira,name:"Hoy",role:"Para contactar hoy"};
  closeSheet();current=hoy;render(hoy);showSheet();body.scrollTop=0;renderDock();
}
function renderHoyBtn(){
  const n=ZDB.ready?ZDB.alerts.length:0;
  document.getElementById("hoy-btn").innerHTML=`🔔${n?`<span class="badge">${n}</span>`:""}`;
  renderHomeCard();
}
function paintAvatar(a){const c=document.getElementById("av"),x=c.getContext("2d");const r=window.devicePixelRatio||1;
  c.width=38*r;c.height=38*r;x.setTransform(r,0,0,r,0,0);
  const saved=ctx;ctx=x;try{drawPerson(19,52,a,0,false,false);}finally{ctx=saved;}}

// ---------- Dock ----------
// Acceso directo: un toque abre el panel (o entra al CRM) al instante, sin
// esperar a que el avatar camine. Caminar en la escena sigue existiendo
// como interacción inmersiva aparte (goToAgent/goToDespacho).
const dock=document.getElementById("dock");
const DOCK_ITEMS=[...AGENTS,DESPACHO];
function renderDock(){dock.innerHTML=DOCK_ITEMS.map((a,i)=>{const b=a.badge?a.badge():0;
  const isActive=!!(current&&a.key&&current.key===a.key);
  return `<button data-i="${i}" class="${isActive?'active':''}" aria-label="${a.despacho?'Entrar al CRM':'Abrir '+a.name}">
  ${b?`<span class="badge">${b}</span>`:""}<i>${a.icon||''}</i><b>${a.name}</b><span>${a.role||''}</span></button>`;}).join("");
  dock.querySelectorAll("button").forEach(b=>b.onclick=()=>arriveAt(DOCK_ITEMS[+b.dataset.i]));}
function greetingWord(){const h=new Date().getHours();return h<6?"Buenas noches":h<13?"Buen día":h<20?"Buenas tardes":"Buenas noches";}
function renderHomeCard(){
  const greet=document.getElementById("greet");
  if(greet)greet.textContent=greetingWord()+", Capocha";
  const el=document.getElementById("homecard");
  if(!el)return;
  if(!ZDB.ready){el.innerHTML=`<h4>Tu oficina hoy</h4><div class="hc-row"><i>⏳</i><span>Cargando datos reales…</span></div>`;return;}
  const n=ZDB.alerts.length;
  const dias=ZDB.config.dias_cobro_cerca??7, hoy=todayStrOf();
  const cobros=ZDB.flows.filter(f=>!f.cobrado&&f.fecha>=hoy&&zafiraDaysBetween(hoy,f.fecha)<=dias).length;
  el.innerHTML=`<h4>Tu oficina hoy</h4>
    <div class="hc-row"><i>📞</i><b>${n}</b><span>para contactar</span></div>
    <div class="hc-row"><i>💵</i><b>${cobros}</b><span>cobros próximos (${dias}d)</span></div>
    ${!n&&!cobros?`<div class="hc-ok">✓ Todo al día</div>`:""}`;
}
renderDock();
renderHoyBtn();

function tick(){const d=new Date();document.getElementById("clock").textContent=d.toLocaleTimeString("es-AR",{hour:"2-digit",minute:"2-digit"});renderHomeCard();}
tick();setInterval(tick,15000);
setTimeout(()=>{const h=document.getElementById("hint");if(h)h.hidden=true;},6000);

resize();
(document.fonts?document.fonts.ready:Promise.resolve()).then(()=>requestAnimationFrame(frame));
</script>
</body>
</html>
