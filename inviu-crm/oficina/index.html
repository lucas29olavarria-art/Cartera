// Mi despacho: no es un personaje, es la puerta de entrada al CRM real.
// Oficina privada vidriada junto a la ventana (x8-9,y0-1), para que se note

const DESPACHO={gx:9,gy:0,desk:[9,0],despacho:true,name:"Mi despacho",role:"Entrar al CRM"};

// ---------- Mundo isométrico ----------
const W=12,H=12,TW=64,TH=32,WALLH=136,M=20;
const OX=H*TW/2+M, OY=WALLH+M+40;
const WORLD_W=(W+H)*TW/2+2*M, WORLD_H=(W+H)*TH/2+WALLH+2*M+56;
const iso=(x,y)=>[(x-y)*TW/2+OX,(x+y)*TH/2+OY];

const blocked=new Set(), edgeBlock=new Set();
const key=(x,y)=>x+","+y;
const ek=(a,b,c,d)=>a+","+b+">"+c+","+d;
function blockEdge(a,b,c,d){edgeBlock.add(ek(a,b,c,d));edgeBlock.add(ek(c,d,a,b));}
// sala de reuniones vidriada: x 8..11, y 6..11 (puerta en y=10)
for(let y=6;y<H;y++) if(y!==10) blockEdge(7,y,8,y);
for(let x=8;x<W;x++) blockEdge(x,5,x,6);
// despacho vidriado: x 8..9, y 0..1 (puerta en el lateral oeste, y=1)
blockEdge(7,0,8,0);
blockEdge(9,0,10,0);blockEdge(9,1,10,1);
blockEdge(8,1,8,2);blockEdge(9,1,9,2);

const FURN=[];
const add=(type,gx,gy,extra={})=>{FURN.push({type,gx,gy,...extra});blocked.add(key(gx,gy));};
AGENTS.forEach(a=>blocked.add(key(a.gx,a.gy)));
add("shelf",1,0);blocked.add(key(2,0));add("plant",0,0);add("cooler",5,0);add("plant",11,0);add("plant",7,0);
add("recep",1,8,{end:"l"});add("recep",2,8,{mon:true,logo:true});add("recep",3,8,{end:"r",phone:true});
add("desk",4,3,{mon:true});add("desk",5,3,{plant:true});add("desk",6,3,{laptop:true});add("desk",10,3,{mon:true,laptop:true});
add("desk",4,4,{laptop:true});add("desk",5,4,{mon:true});add("desk",6,4,{});
add("desk",9,0,{mon:true,plant:true});
add("sofa",4,9);add("sofa",5,9);add("ctable",4,10);add("ctable",5,10);add("plant",3,11);add("lamp",6,9);
add("mtable",9,8,{laptop:true});add("mtable",10,8,{mug:true});add("mtable",9,9,{mug:true});add("mtable",10,9,{laptop:true});
add("fooz",7,11);add("coffee",11,4);add("plant",11,11);add("plant",7,6);
const GLASS=[];for(let y=6;y<H;y++)GLASS.push({ax:"x",x:8,y,door:y===10});for(let x=8;x<W;x++)GLASS.push({ax:"y",x,y:6});
// despacho vidriado
GLASS.push({ax:"x",x:8,y:0});GLASS.push({ax:"x",x:8,y:1,door:true});
GLASS.push({ax:"x",x:10,y:0});GLASS.push({ax:"x",x:10,y:1});
GLASS.push({ax:"y",x:8,y:2});GLASS.push({ax:"y",x:9,y:2});

const player={x:6.5,y:7.5,path:[],dir:1,target:null};
let marker=null;

// ---------- Canvas ----------
const cv=document.getElementById("cv");let ctx=cv.getContext("2d");
let scale=1,offX=0,offY=0,dpr=1,fit=1,zoom=false,cw=0,ch=0;
function resize(){
  const r=cv.getBoundingClientRect();dpr=Math.min(window.devicePixelRatio||1,2);cw=r.width;ch=r.height;
  cv.width=Math.round(r.width*dpr);cv.height=Math.round(r.height*dpr);
  fit=Math.min(r.width/WORLD_W,r.height/WORLD_H);
}
window.addEventListener("resize",resize);
function camera(){
  scale=zoom?Math.max(fit*2,0.9):fit;
  const ww=WORLD_W*scale,wh=WORLD_H*scale;
  if(!zoom||ww<=cw){offX=(cw-ww)/2;} else {const [px]=iso(player.x,player.y);offX=Math.min(0,Math.max(cw-ww,cw/2-px*scale));}
  if(!zoom||wh<=ch){offY=(ch-wh)/2;} else {const [,py]=iso(player.x,player.y);offY=Math.min(0,Math.max(ch-wh,ch/2-(py-40)*scale));}
}

function poly(pts,fill,stroke,lw){ctx.beginPath();pts.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));ctx.closePath();
  if(fill){ctx.fillStyle=fill;ctx.fill();}if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=lw||1;ctx.stroke();}}
function shade(hex,f){const n=parseInt(hex.slice(1),16);let r=n>>16,g=n>>8&255,b=n&255;
  r=Math.max(0,Math.min(255,Math.round(r*f)));g=Math.max(0,Math.min(255,Math.round(g*f)));b=Math.max(0,Math.min(255,Math.round(b*f)));
  return "#"+((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1);}
// caja isométrica: x0,y0 esquina, dx,dy tamaño en tiles, h alto, lift elevación
function box(x0,y0,dx,dy,h,col,lift=0,top){
  const a=iso(x0,y0),b=iso(x0+dx,y0),c=iso(x0+dx,y0+dy),d=iso(x0,y0+dy);
  const up=p=>[p[0],p[1]-h-lift], lo=p=>[p[0],p[1]-lift];
  poly([lo(d),lo(c),up(c),up(d)],shade(col,.7));
  poly([lo(c),lo(b),up(b),up(c)],shade(col,.85));
  poly([up(a),up(b),up(c),up(d)],top||col,shade(top||col,.75));
}
// dibujar en el plano de una pared: "L" = pared izquierda (x=0), "R" = pared derecha (y=0)
function onWall(side,t,fn){const p=side==="L"?iso(0,t):iso(t,0);ctx.save();
  ctx.transform(1,side==="L"?-0.5:0.5,0,1,p[0],p[1]);fn();ctx.restore();}

function drawRoom(t){
  const p00=iso(0,0),p0H=iso(0,H),pW0=iso(W,0),pWH=iso(W,H);
  // paredes
  poly([p0H,p00,[p00[0],p00[1]-WALLH],[p0H[0],p0H[1]-WALLH]],"#232a37");
  poly([p00,pW0,[pW0[0],pW0[1]-WALLH],[p00[0],p00[1]-WALLH]],"#2b3343");
  poly([p0H,p00,[p00[0],p00[1]-10],[p0H[0],p0H[1]-10]],"#5a4330");
  poly([p00,pW0,[pW0[0],pW0[1]-10],[p00[0],p00[1]-10]],"#6b5038");
  // cantos superiores
  poly([[p0H[0],p0H[1]-WALLH],[p00[0],p00[1]-WALLH],[p00[0],p00[1]-WALLH-8],[p0H[0]+8,p0H[1]-WALLH-4]],"#3a4456");
  poly([[p00[0],p00[1]-WALLH],[pW0[0],pW0[1]-WALLH],[pW0[0]-8,pW0[1]-WALLH-4],[p00[0],p00[1]-WALLH-8]],"#46516a");

  // marca en la pared izquierda
  const L=32; // px por tile a lo largo de la pared
  onWall("L",9.2,()=>{
    // monograma
    ctx.fillStyle="#e9ecef";ctx.fillRect(0,-104,30,30);
    ctx.fillStyle="#232a37";ctx.font="700 17px 'Pixelify Sans', monospace";ctx.textAlign="center";ctx.textBaseline="middle";ctx.fillText("LO",15,-88);
    ctx.textAlign="left";ctx.textBaseline="alphabetic";
    ctx.fillStyle="#eef1f4";ctx.font="700 30px 'Pixelify Sans', monospace";ctx.fillText("LUCAS",40,-82);
    ctx.font="700 30px 'Pixelify Sans', monospace";ctx.fillText("OLAVARRIA",40,-52);
    ctx.fillStyle="#f2c14e";ctx.font="600 12px 'Pixelify Sans', monospace";ctx.fillText("ASESOR FINANCIERO · IDÓNEO CNV",42,-34);
  });
  // puerta de entrada (vidrio) en la pared izquierda

// ---------- Movimiento ----------
function bfs(sx,sy,goals){
  const goalSet=new Set(goals.map(g=>key(g[0],g[1])));
  const q=[[sx,sy]],prev={};prev[key(sx,sy)]=null;
  while(q.length){const [x,y]=q.shift();if(goalSet.has(key(x,y))){const path=[];let k=key(x,y);
      while(k){const [a,b]=k.split(",").map(Number);path.unshift([a,b]);k=prev[k];}path.shift();return path;}
    for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){const nx=x+dx,ny=y+dy,k=key(nx,ny);
      if(nx<0||ny<0||nx>=W||ny>=H||blocked.has(k)||k in prev||edgeBlock.has(ek(x,y,nx,ny)))continue;prev[k]=key(x,y);q.push([nx,ny]);}}
  return null;
}
function walkTo(goals,agent){
  const sx=Math.round(player.x-0.5),sy=Math.round(player.y-0.5);
  const path=bfs(sx,sy,goals);
  if(!path)return;
  player.path=path;player.target=agent||null;
  marker=path.length?path[path.length-1]:null;
  if(!path.length&&agent)arriveAt(agent);
}
function arriveAt(a){
  if(a.despacho)location.href="../index.html";
  else openAgent(a);
}
function goToAgent(a){
  const n=([x,y])=>[[x+1,y],[x-1,y],[x,y+1],[x,y-1]];
  const goals=[...n(a.desk),...n([a.gx,a.gy])].filter(([x,y])=>x>=0&&y>=0&&x<W&&y<H&&!blocked.has(key(x,y)));
  closeSheet();walkTo(goals,a);
}
function goToDespacho(){
  // El despacho es un cuarto cerrado (puerta en el lateral oeste) — a
  // diferencia de un escritorio en planta abierta, no cualquier tile
  // vecino sirve de meta: solo el piso de adentro, para que camine por
  // la puerta y no "llegue" parado del otro lado del vidrio.
  const goals=[[8,0],[9,1]].filter(([x,y])=>!blocked.has(key(x,y)));
  closeSheet();walkTo(goals,DESPACHO);
}

function screenToWorld(e){const r=cv.getBoundingClientRect();return[(e.clientX-r.left-offX)/scale,(e.clientY-r.top-offY)/scale];}
cv.addEventListener("pointerdown",e=>{
  const [wx,wy]=screenToWorld(e);
  {const [fx,fy]=iso(DESPACHO.desk[0]+.5,DESPACHO.desk[1]+.5);if(Math.abs(wx-fx)<26&&wy<fy+12&&wy>fy-36){goToDespacho();return;}}
  for(const a of AGENTS){const [fx,fy]=iso(a.gx+.5,a.gy+.5);if(Math.abs(wx-fx)<16&&wy<fy+4&&wy>fy-60){goToAgent(a);return;}}
  for(const a of AGENTS){const [fx,fy]=iso(a.desk[0]+.5,a.desk[1]+.5);if(Math.abs(wx-fx)<26&&wy<fy+12&&wy>fy-36){goToAgent(a);return;}}
  const sx=wx-OX,sy=wy-OY;const gx=Math.floor((sx/(TW/2)+sy/(TH/2))/2),gy=Math.floor((sy/(TH/2)-sx/(TW/2))/2);
  if(gx<0||gy<0||gx>=W||gy>=H||blocked.has(key(gx,gy)))return;

// ---------- Loop ----------
let last=performance.now();
const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
const ME={shirt:"#20324d",stripes:true,hair:"#3b2416",skin:"#e2b48c",hairStyle:"cap",pants:"#3a3f4a"};
// Alternativa A de dirección de arte: luz ambiental sobre lo existente,
// sin tocar la geometría de ningún mueble — viñeta + resplandor cálido
// cerca del ventanal, para dar profundidad sin rehacer nada.
function ambientLight(){
  const cx=WORLD_W/2, cy=WORLD_H/2-20;
  const vg=ctx.createRadialGradient(cx,cy,Math.min(WORLD_W,WORLD_H)*.22,cx,cy,Math.max(WORLD_W,WORLD_H)*.62);
  vg.addColorStop(0,"rgba(0,0,0,0)");vg.addColorStop(1,"rgba(5,8,14,.4)");
  ctx.fillStyle=vg;ctx.fillRect(0,0,WORLD_W,WORLD_H);
  const [wx,wy]=iso(9,0);
  const gl=ctx.createRadialGradient(wx,wy-110,10,wx,wy-110,260);
  gl.addColorStop(0,"rgba(255,214,140,.16)");gl.addColorStop(1,"rgba(255,214,140,0)");
  ctx.fillStyle=gl;ctx.fillRect(0,0,WORLD_W,WORLD_H);
}
function frame(t){
  const dt=Math.min(50,t-last);last=t;
  if(player.path.length){const [nx,ny]=player.path[0];const tx=nx+.5,ty=ny+.5;const dx=tx-player.x,dy=ty-player.y;const d=Math.hypot(dx,dy);
    const sp=(reduce?6:3.4)*dt/1000;
    if(d<=sp){player.x=tx;player.y=ty;player.path.shift();if(!player.path.length){marker=null;if(player.target){const a=player.target;player.target=null;arriveAt(a);}}}
    else{player.x+=dx/d*sp;player.y+=dy/d*sp;player.dir=(dx-dy)<0?-1:1;}}
  camera();
  ctx.setTransform(1,0,0,1,0,0);ctx.clearRect(0,0,cv.width,cv.height);
  ctx.setTransform(dpr*scale,0,0,dpr*scale,dpr*offX,dpr*offY);
  drawRoom(t);
  if(marker){const [x,y]=marker;ctx.globalAlpha=.5+.3*Math.sin(t/150);poly([iso(x,y),iso(x+1,y),iso(x+1,y+1),iso(x,y+1)],"rgba(242,193,78,.5)","#f2c14e");ctx.globalAlpha=1;}
  const items=[];
  FURN.forEach(f=>items.push({d:f.gx+f.gy+0.55,draw:()=>drawFurn(f,t)}));
  GLASS.forEach(g=>items.push({d:g.ax==="x"?g.x+g.y:g.x+g.y+0.0,draw:()=>drawGlass(g)}));
  AGENTS.forEach(a=>items.push({d:a.gx+a.gy+0.5,draw:()=>{const [fx,fy]=iso(a.gx+.5,a.gy+.5);drawPerson(fx,fy,a,t,false,false);}}));
  const walking=player.path.length>0;
  items.push({d:player.x+player.y-0.5+0.01,draw:()=>{const [fx,fy]=iso(player.x,player.y);drawPerson(fx,fy,ME,t,walking,player.dir<0);}});
  items.sort((a,b)=>a.d-b.d).forEach(i=>i.draw());
  ambientLight();
  AGENTS.forEach(a=>{const [fx,fy]=iso(a.gx+.5,a.gy+.5);nameTag(fx,fy-64,a.name+" · "+a.role);bubble(fx,fy-76,a.status(),t+a.gx*300);});
  {const [fx,fy]=iso(DESPACHO.desk[0]+.5,DESPACHO.desk[1]+.5);nameTag(fx,fy-46,"Mi despacho → CRM","#5fc48a");}
  {const [fx,fy]=iso(player.x,player.y);nameTag(fx,fy-62,"Capocha","#f2c14e");}
  requestAnimationFrame(frame);
}

// ---------- Paneles ----------
const sheet=document.getElementById("sheet"),body=document.getElementById("sh-body");
function closeSheet(){sheet.hidden=true;}
document.getElementById("sh-close").onclick=closeSheet;
function toast(t){const el=document.getElementById("toast");el.textContent=t;el.hidden=false;clearTimeout(el._t);el._t=setTimeout(()=>el.hidden=true,1600);}
async function copy(text,pre){try{await navigator.clipboard.writeText(text);toast("Copiado ✓");}
  catch(e){const r=document.createRange();r.selectNodeContents(pre);const s=getSelection();s.removeAllRanges();s.addRange(r);toast("Seleccionado: mantené apretado para copiar");}}
const esc=s=>s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));

function textBlock(text,label){
  const id="m"+Math.random().toString(36).slice(2,7);
  return `<pre class="msg" id="${id}">${esc(text)}</pre><button class="btn" data-copy="${id}">${label||"Copiar texto"}</button>`;
}
function bindCopies(){body.querySelectorAll("[data-copy]").forEach(b=>b.onclick=()=>{const pre=document.getElementById(b.dataset.copy);copy(pre.textContent,pre);});}

const VIEWS={
  research(tab="wpp"){
    return `<div class="demo">Texto de ejemplo · los x,x se completan con datos reales</div>
    <div class="say">¡Buenas! Ya te dejé el informe de hoy para la comunidad. Revisalo y pegalo.</div>
    <div class="tabs"><button class="tab" data-tab="wpp" aria-pressed="${tab==="wpp"}">Morning WhatsApp</button><button class="tab" data-tab="prop" aria-pressed="${tab==="prop"}">Idea de la semana</button></div>
    ${textBlock(tab==="wpp"?WPP:PROPUESTA)}
    <p class="note">Va siempre con disclaimer y sin recomendaciones personalizadas: es contenido público.</p>`;
  },
  secre(){
    const pend=CLIENTES.filter(c=>!c.done).length;
    return `<div class="demo">Clientes de ejemplo</div>
    <div class="say">${pend?`Hoy tenés ${pend} ${pend===1?"persona":"personas"} para contactar. Arrancá por las de arriba.`:"¡Llamaste a todos! Te ganaste el café ☕"}</div>
    <h3>Para llamar hoy</h3><div class="list">${CLIENTES.map(c=>`<div class="row ${c.done?"done":c.tipo}"><div class="t"><b>${c.n}</b><span>${c.motivo}</span></div>
      <button class="btn ${c.done?"ghost":""}" data-call="${c.id}">${c.done?"Deshacer":"Lo llamé"}</button></div>`).join("")}</div>
    <h3>Cobros de la semana</h3><div class="list">${COBROS.map(c=>`<div class="row"><div class="t"><b>${c.n} · ${c.d}</b><span>${c.t}</span></div></div>`).join("")}</div>`;
  },
  fin(){
    const tot=COMIS.reduce((s,c)=>s+c.v,0),max=COMIS[0].v;
    return `<div class="demo">Números de ejemplo · después salen del mail de comisiones</div>
    <div class="say">Octubre viene bien, jefe. Ojo que Martín tiene buen patrimonio pero casi no te deja comisión: charlá su cartera.</div>
    <div class="kpis"><div class="kpi"><span>Comisiones oct</span><b>${ARS(tot)}</b></div><div class="kpi"><span>vs. septiembre</span><b style="color:var(--ok)">▲ 12%</b></div><div class="kpi"><span>Proyección nov</span><b>${ARS(Math.round(tot*1.06/1000)*1000)}</b></div></div>
    <h3>Ranking por cliente</h3><div class="list">${COMIS.map(c=>`<div class="bar"><span>${c.n}</span><i style="width:${Math.max(4,c.v/max*100)}%"></i><em>${Math.round(c.v/1000)}k</em></div>`).join("")}</div>
    <h3>Para revisar</h3><div class="list">
      <div class="row mid"><div class="t"><b>Martín G.</b><span>AUM alto, comisión baja: mucho en instrumentos sin costo</span></div></div>
      <div class="row mid"><div class="t"><b>Ana L.</b><span>Le entra una amortización: plata para reinvertir</span></div></div></div>`;
  },
  mkt(tab="Referidos"){
    return `<div class="say">¿Qué armamos hoy? Elegí y te dejo el borrador. Completá lo que está entre corchetes.</div>
    <div class="tabs">${Object.keys(MKT).map(k=>`<button class="tab" data-tab="${k}" aria-pressed="${tab===k}">${k}</button>`).join("")}</div>
    ${textBlock(MKT[tab])}`;
  }
};
let current=null;
function render(a,tab){
  document.getElementById("sh-name").textContent=a.name;document.getElementById("sh-role").textContent=a.role;
  body.innerHTML=VIEWS[a.key](tab);bindCopies();
  body.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>render(a,b.dataset.tab));
  body.querySelectorAll("[data-call]").forEach(b=>b.onclick=()=>{const c=CLIENTES.find(c=>c.id==b.dataset.call);c.done=!c.done;
    if(c.done)toast("Anotado ✓");render(a);renderDock();renderHoyBtn();});
  paintAvatar(a);
}
function openAgent(a){current=a;render(a);sheet.hidden=false;body.scrollTop=0;}
// "Hoy": acceso directo en la barra superior a lo mismo que ve Zafira — no
// es un agente nuevo, es un atajo al mismo dato (a quién contactar hoy).
function openHoy(){
  const zafira=AGENTS.find(a=>a.key==="secre");
  const hoy={...zafira,name:"Hoy",role:"Para contactar hoy"};
  closeSheet();current=hoy;render(hoy);sheet.hidden=false;body.scrollTop=0;
}
function renderHoyBtn(){
  const n=CLIENTES.filter(c=>!c.done).length;
  document.getElementById("hoy-btn").textContent=n?`📋 Hoy (${n})`:"📋 Hoy";
}
function paintAvatar(a){const c=document.getElementById("av"),x=c.getContext("2d");const r=window.devicePixelRatio||1;
  c.width=38*r;c.height=38*r;x.setTransform(r,0,0,r,0,0);
  const saved=ctx;ctx=x;try{drawPerson(19,52,a,0,false,false);}finally{ctx=saved;}}

// ---------- Dock ----------
// Acceso directo: un toque abre el panel (o entra al CRM) al instante, sin
// esperar a que el avatar camine. Caminar en la escena sigue existiendo
// como interacción inmersiva aparte (goToAgent/goToDespacho).
const dock=document.getElementById("dock");
const DOCK_ITEMS=[...AGENTS,DESPACHO];
function renderDock(){dock.innerHTML=DOCK_ITEMS.map((a,i)=>{const b=a.badge?a.badge():0;
  return `<button data-i="${i}" aria-label="${a.despacho?'Entrar al CRM':'Abrir '+a.name}">
  ${b?`<span class="badge">${b}</span>`:""}<b>${a.despacho?'🏢 ':''}${a.name}</b></button>`;}).join("");
  dock.querySelectorAll("button").forEach(b=>b.onclick=()=>arriveAt(DOCK_ITEMS[+b.dataset.i]));}
renderDock();
renderHoyBtn();

function tick(){const d=new Date();document.getElementById("clock").textContent=d.toLocaleTimeString("es-AR",{hour:"2-digit",minute:"2-digit"});}
tick();setInterval(tick,15000);
setTimeout(()=>{const h=document.getElementById("hint");if(h)h.hidden=true;},6000);

resize();
(document.fonts?document.fonts.ready:Promise.resolve()).then(()=>requestAnimationFrame(frame));
</script>
</body>
